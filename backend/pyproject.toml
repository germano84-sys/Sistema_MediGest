[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "medigest-backend"
version = "0.1.0"
description = "FastAPI backend for MediGest"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.1",
    "cryptography==45.0.4",
    "fastapi==0.115.12",
    "python-multipart==0.0.20",
    "PyJWT[crypto]==2.10.1",
    "pydantic-settings==2.9.1",
    "psycopg[binary]==3.2.9",
    "sqlalchemy==2.0.41",
    "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
